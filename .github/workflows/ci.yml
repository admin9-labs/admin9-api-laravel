name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: composer validate --no-check-publish --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate --force --no-interaction
      - run: php artisan jwt:secret --always-no --no-interaction
      - run: touch database/database.sqlite
      - run: php artisan migrate --force --no-interaction
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: composer audit --locked --no-interaction
      - run: composer check

  mysql-concurrency:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: admin9_concurrency_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none

      - run: composer validate --no-check-publish --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test:mysql-concurrency
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: admin9_concurrency_test
          DB_HOST: 127.0.0.1
          DB_PASSWORD: ''
          DB_PORT: 3306
          DB_USERNAME: root
          MYSQL_CONCURRENCY_DATABASE: admin9_concurrency_test
          MYSQL_CONCURRENCY_ROUNDS: 3
